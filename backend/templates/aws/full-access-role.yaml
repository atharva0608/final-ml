AWSTemplateFormatVersion: '2010-09-09'
Description: 'Spot Optimizer Cross-Account Access Role'
Parameters:
  ExternalId:
    Type: String
    Description: 'The External ID provided by the Spot Optimizer dashboard'
  SpotOptimizerAccountArn:
    Type: String
    Description: 'The ARN of the Spot Optimizer Backend User/Role'
    Default: 'arn:aws:iam::123456789012:root' # Replace with your actual backend account ID if known, or pass as param

Resources:
  SpotOptimizerRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub 'SpotOptimizer-Access-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref SpotOptimizerAccountArn
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      Policies:
        - PolicyName: 'ClusterDiscovery'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'eks:ListClusters'
                  - 'eks:DescribeCluster'
                  - 'ec2:DescribeInstances'
                  - 'ec2:DescribeRegions'
                  - 'ce:GetCostAndUsage'
                  - 'autoscaling:DescribeAutoScalingGroups'
                Resource: '*'
        - PolicyName: 'AgentInjection'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'eks:CreateAccessEntry'
                  - 'eks:DeleteAccessEntry'
                  - 'eks:AssociateAccessPolicy'
                Resource: '*'
Outputs:
  RoleArn:
    Description: 'The ARN of the role to paste into Spot Optimizer'
    Value: !GetAtt SpotOptimizerRole.Arn
