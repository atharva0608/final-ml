AWSTemplateFormatVersion: '2010-09-09'
Description: 'Spot Optimizer: Full Access for Autoscaling and Optimization'

Parameters:
  ExternalId:
    Type: String
    Description: 'Unique External ID for this account connection (Generated by Spot Optimizer)'
    MinLength: 36
    MaxLength: 36

  PlatformAccountId:
    Type: String
    Description: 'The AWS Account ID of the Spot Optimizer Platform'
    Default: '123456789012'
    MinLength: 12
    MaxLength: 12

Resources:
  SpotOptimizerRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub 'SpotOptimizer-Access-Role-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${PlatformAccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/SecurityAudit'
        - 'arn:aws:iam::aws:policy/AWSBillingReadOnlyAccess'
        - 'arn:aws:iam::aws:policy/AmazonEC2FullAccess' # Scoped down in production
      Policies:
        - PolicyName: 'SpotOptimizerDiscovery'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'eks:ListClusters'
                  - 'eks:DescribeCluster'
                  - 'eks:ListNodegroups'
                  - 'ec2:DescribeInstances'
                  - 'autoscaling:DescribeAutoScalingGroups'
                  # Cost Insights Permissions:
                  - 'ce:GetCostAndUsage'
                  - 'ce:GetCostForecast'
                Resource: '*'
        - PolicyName: 'SpotOptimizerInjection'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  # Injection Permissions:
                  - 'eks:CreateAccessEntry'
                  - 'eks:DeleteAccessEntry'
                  - 'eks:ListAccessEntries'
                  - 'eks:AssociateAccessPolicy'
                Resource: '*'
Outputs:
  RoleArn:
    Value: !GetAtt SpotOptimizerRole.Arn
