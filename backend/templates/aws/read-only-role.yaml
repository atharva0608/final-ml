AWSTemplateFormatVersion: '2010-09-09'
Description: |
  SpotOptimizer Cross-Account IAM Role
  ====================================
  This template creates a secure cross-account IAM role that allows the SpotOptimizer
  platform to analyze and optimize your AWS resources. The role uses External ID
  authentication for enhanced security (AWS Confused Deputy protection).
  
  Security Features:
  - External ID verification prevents unauthorized access
  - Read-only managed policies for safe analysis
  - Optional cleanup permissions with explicit consent
  - No credentials stored - uses STS AssumeRole
  
  For support: https://spotoptimizer.io/docs

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Required Configuration"
        Parameters:
          - ExternalId
      - Label:
          default: "Advanced (Do Not Modify)"
        Parameters:
          - PlatformAccountId
    ParameterLabels:
      ExternalId:
        default: "Your Organization External ID (auto-filled from dashboard)"
      PlatformAccountId:
        default: "SpotOptimizer Platform Account ID"

Parameters:
  ExternalId:
    Type: String
    Description: 'Your unique security token from the SpotOptimizer dashboard. This prevents unauthorized access to your account.'
    MinLength: 1
    MaxLength: 256
  
  PlatformAccountId:
    Type: String
    Description: 'The AWS Account ID of the SpotOptimizer platform (do not modify)'
    Default: '123456789012'
    MinLength: 1
    MaxLength: 256

Conditions:
  IsDummyAccount: !Equals [!Ref PlatformAccountId, '123456789012']

Resources:
  SpotOptimizerRole:
    Type: 'AWS::IAM::Role'
    Properties:
      Description: 'Cross-account access role for SpotOptimizer platform'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'AllowSpotOptimizerAssumeRole'
            Effect: Allow
            Principal:
              AWS: !If [IsDummyAccount, !Sub 'arn:aws:iam::${AWS::AccountId}:root', !Sub 'arn:aws:iam::${PlatformAccountId}:root']
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      ManagedPolicyArns:
        # Read-Only Policies for Analysis
        - 'arn:aws:iam::aws:policy/SecurityAudit'
        - 'arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess'
        - 'arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess'
      Policies:
        - PolicyName: 'SpotOptimizerAnalysis'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # EC2 Instance Management (Required for optimization)
              - Sid: 'EC2InstanceManagement'
                Effect: Allow
                Action:
                  - 'ec2:DescribeInstances'
                  - 'ec2:DescribeInstanceTypes'
                  - 'ec2:DescribeInstanceStatus'
                  - 'ec2:DescribeInstanceTypeOfferings'
                  - 'ec2:DescribeRegions'
                  - 'ec2:DescribeAvailabilityZones'
                  - 'ec2:DescribeVpcs'
                  - 'ec2:DescribeSubnets'
                  - 'ec2:DescribeSecurityGroups'
                  - 'ec2:DescribeVolumes'
                  - 'ec2:DescribeSnapshots'
                  - 'ec2:DescribeImages'
                  - 'ec2:DescribeKeyPairs'
                  - 'ec2:DescribeTags'
                  - 'ec2:DescribeSpotInstanceRequests'
                  - 'ec2:DescribeReservedInstances'
                  - 'ec2:DescribeSpotPriceHistory'
                  - 'ec2:RunInstances'
                  - 'ec2:ModifyInstanceAttribute'
                  - 'ec2:CreateTags'
                  - 'ec2:DeleteTags'
                Resource: '*'

              # EKS Cluster Management (Required for Kubernetes)
              - Sid: 'EKSManagement'
                Effect: Allow
                Action:
                  - 'eks:DescribeCluster'
                  - 'eks:ListClusters'
                  - 'eks:DescribeNodegroup'
                  - 'eks:ListNodegroups'
                  - 'eks:DescribeUpdate'
                  - 'eks:ListUpdates'
                  - 'eks:DescribeFargateProfile'
                  - 'eks:ListFargateProfiles'
                  - 'eks:AccessKubernetesApi'
                Resource: '*'

              # Auto Scaling (Required for node group management)
              - Sid: 'AutoScalingManagement'
                Effect: Allow
                Action:
                  - 'autoscaling:DescribeAutoScalingGroups'
                  - 'autoscaling:DescribeAutoScalingInstances'
                  - 'autoscaling:DescribeLaunchConfigurations'
                  - 'autoscaling:DescribeScalingActivities'
                  - 'autoscaling:DescribeTags'
                  - 'autoscaling:UpdateAutoScalingGroup'
                  - 'autoscaling:SetDesiredCapacity'
                  - 'autoscaling:TerminateInstanceInAutoScalingGroup'
                Resource: '*'

              # CloudWatch Metrics (Required for utilization analysis)
              - Sid: 'CloudWatchMetrics'
                Effect: Allow
                Action:
                  - 'cloudwatch:GetMetricStatistics'
                  - 'cloudwatch:ListMetrics'
                  - 'cloudwatch:GetMetricData'
                Resource: '*'

              # IAM Read-Only (For validation)
              - Sid: 'IAMReadOnly'
                Effect: Allow
                Action:
                  - 'iam:GetRole'
                  - 'iam:GetInstanceProfile'
                  - 'iam:ListAttachedRolePolicies'
                Resource: '*'

              # STS (Required)
              - Sid: 'STSIdentity'
                Effect: Allow
                Action:
                  - 'sts:GetCallerIdentity'
                Resource: '*'

              # Cost Explorer for Savings Analysis
              - Sid: 'CostAnalysis'
                Effect: Allow
                Action:
                  - 'ce:GetCostAndUsage'
                  - 'ce:GetCostForecast'
                  - 'ce:GetReservationUtilization'
                  - 'ce:GetSavingsPlansUtilization'
                Resource: '*'
        - PolicyName: 'SpotOptimizerCleanup'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Resource Cleanup Actions (Requires Approval)
              - Sid: 'CleanupActions'
                Effect: Allow
                Action:
                  - 'ec2:TerminateInstances'
                  - 'ec2:StopInstances'
                  - 'ec2:DeleteVolume'
                  - 'ec2:DeleteSnapshot'
                  - 'ec2:ReleaseAddress'
                  - 'ec2:DeleteNetworkInterface'
                Resource: '*'
                Condition:
                  StringEquals:
                    'ec2:ResourceTag/SpotOptimizer': 'managed'
      Tags:
        - Key: 'ManagedBy'
          Value: 'SpotOptimizer'
        - Key: 'Environment'
          Value: 'Production'
        - Key: 'ExternalId'
          Value: !Ref ExternalId

Outputs:
  RoleArn:
    Description: 'Copy this ARN and paste it in the SpotOptimizer dashboard to complete the connection.'
    Value: !GetAtt SpotOptimizerRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RoleArn'
  
  ExternalId:
    Description: 'Your unique External ID (for reference)'
    Value: !Ref ExternalId
  
  Instructions:
    Description: 'Next Steps'
    Value: 'Stack created successfully! Copy the RoleArn above and paste it in your SpotOptimizer dashboard.'
