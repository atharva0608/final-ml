image:
  repository: atharva608/spot-optimizer-agent
  tag: "{{ .Chart.AppVersion }}"  # N4 fix: pin to chart version, never use 'latest' in production
  pullPolicy: IfNotPresent

config:
  apiKey: ""
  backendUrl: ""
  clusterId: ""

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

serviceAccount:
  create: true
  name: "spot-optimizer-agent"

namespace: "spot-optimizer"

# nodeSelector for the DaemonSet.
# Multi-arch image (linux/amd64+arm64) is available — no architecture restriction.
nodeSelector: {}

orchestrator:
  enabled: true
  replicaCount: 1
  image:
    repository: atharva608/spot-optimizer-agent
    tag: "{{ .Chart.AppVersion }}"  # N4 fix: pin to chart version
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  port: 8080
