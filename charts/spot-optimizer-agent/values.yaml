image:
  repository: atharva608/spot-optimizer-agent
  tag: "1.1.6"
  pullPolicy: Always

config:
  apiKey: ""
  backendUrl: "https://basketball-trees-estimates-generally.trycloudflare.com"
  clusterId: ""

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

serviceAccount:
  create: true
  name: "spot-optimizer-agent"

namespace: "spot-optimizer"

# nodeSelector for the DaemonSet.
# Multi-arch image (linux/amd64+arm64) is available — no architecture restriction.
nodeSelector: {}

orchestrator:
  enabled: true
  replicaCount: 1
  image:
    repository: atharva608/spot-optimizer-agent
    tag: "1.1.6"
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  port: 8080
