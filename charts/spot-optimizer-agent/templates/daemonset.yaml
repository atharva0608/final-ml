apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spot-agent
  namespace: {{ .Values.namespace }}
  labels:
    app: spot-agent
spec:
  selector:
    matchLabels:
      app: spot-agent
  template:
    metadata:
      labels:
        app: spot-agent
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      hostNetwork: true
      tolerations:
      - operator: "Exists"
      volumes:
      - name: proc
        hostPath:
          path: /proc
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
          env:
            - name: HOST_PROC
              value: "/host/proc"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: spot-agent-secret
                  key: API_KEY
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: spot-agent-config
                  key: BACKEND_URL
            - name: BACKEND_WS_URL
              valueFrom:
                configMapKeyRef:
                  name: spot-agent-config
                  key: BACKEND_WS_URL
            - name: CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: spot-agent-config
                  key: CLUSTER_ID
            - name: IMDS_POLL_INTERVAL_SECONDS
              value: "5"
            - name: IMDS_TERMINATION_URL
              value: "http://169.254.169.254/latest/meta-data/spot/termination-time"
            - name: IMDS_REBALANCE_URL
              value: "http://169.254.169.254/latest/meta-data/events/recommendations/rebalance"
            - name: SPOT_INTERRUPTION_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: spot-agent-config
                  key: BACKEND_URL
            - name: REBALANCE_RECOMMENDATION_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: spot-agent-config
                  key: BACKEND_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
