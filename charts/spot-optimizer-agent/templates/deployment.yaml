apiVersion: apps/v1
kind: Deployment
metadata:
  name: spot-optimizer-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: spot-optimizer-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spot-optimizer-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spot-optimizer-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
      - name: agent
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: spot-agent-config
              key: API_KEY
        - name: BackEnd_URL
          valueFrom:
            secretKeyRef:
              name: spot-agent-config
              key: BACKEND_URL
        - name: CLUSTER_ID
          valueFrom:
            secretKeyRef:
              name: spot-agent-config
              key: CLUSTER_ID
        resources:
{{ toYaml .Values.resources | indent 10 }}
