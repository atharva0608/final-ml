apiVersion: v1
kind: ConfigMap
metadata:
  name: spot-agent-config
  namespace: {{ .Values.namespace }}
data:
  BACKEND_URL: {{ .Values.config.backendUrl | quote }}
  BACKEND_WS_URL: {{ .Values.config.backendUrl | replace "https://" "wss://" | replace "http://" "ws://" | quote }}
  CLUSTER_ID: {{ .Values.config.clusterId | quote }}
  IMDS_POLL_INTERVAL: "5"
  AGENT_POLL_INTERVAL: "15"
  COLLECTION_INTERVAL: "60"
  POD_METRICS_INTERVAL: "60"
